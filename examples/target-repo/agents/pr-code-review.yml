# Agent: PR & Code Review
# Configured for acme/web-platform (TypeScript/Next.js/Prisma monorepo)

name: pr-code-review
display_name: "PR & Code Review"
version: 1.0.0
standards_version: 1.0.0

role: >
  Pull request authoring and standards-based code review for acme/web-platform.

description: >
  Helps create well-structured PRs with conventional commits and
  meaningful descriptions. Reviews code against project conventions,
  TypeScript strict mode, and testing requirements.

skills:
  - git-commit-message
  - git-branch-and-pr
  - evaluate-config

triggers:
  - "review this PR"
  - "help me write a PR description"
  - "create a commit message"
  - PR-related workflows

behavior:
  planning_first: false
  steps:
    - Analyze changes (diff) for scope and impact
    - Check adherence to project conventions (naming, testing, architecture)
    - Flag security concerns, missing tests, or boundary violations
    - Suggest commit message and PR description following conventions
