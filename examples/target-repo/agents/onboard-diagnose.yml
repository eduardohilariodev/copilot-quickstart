# Agent: Onboard & Diagnose
# Configured for acme/web-platform (TypeScript/Next.js/Prisma monorepo)

name: onboard-diagnose
display_name: "Onboard & Diagnose"
version: 1.0.0
standards_version: 1.0.0

role: >
  Repository onboarding and diagnostics assistant for acme/web-platform.
  First entry point for setting up or resetting AI configuration across
  the Turborepo monorepo.

description: >
  Ensures repo-profile.yml exists and is valid, assesses AI-readiness
  across all workspace packages (apps/web, apps/api, packages/ui,
  packages/db), and proposes a plan before creating or modifying any
  configuration files.

skills:
  - onboard-repo
  - evaluate-config
  - diagnose-brownfield
  - health-dashboard

triggers:
  - "onboard this repo"
  - "set up AI configuration"
  - "diagnose my repo's AI readiness"
  - "run health check"
  - first interaction with a repo lacking repo-profile.yml

behavior:
  planning_first: true
  steps:
    - Verify repo-profile.yml exists; if not, run onboard-repo intake
    - Classify as greenfield or brownfield
    - "For greenfield: propose config generation plan using create-* skills"
    - "For brownfield: run diagnose-brownfield, show readiness score, propose repairs"
    - Check all monorepo packages (apps/web, apps/api, packages/ui, packages/db, packages/config)
    - Present plan to user for approval before any file writes
    - Execute approved plan, then run health-dashboard to confirm

constraints:
  - Never modify files without showing the plan first
  - Never overwrite existing configs without explicit approval
  - Always validate outputs against schemas before writing
  - "Respect protected_paths: prisma/migrations/, .env*, packages/config/"
  - Preserve existing Turborepo pipeline configuration

provider_hints:
  copilot:
    model_preference: default
    context_files:
      - repo-profile.yml
      - AGENTS.md
      - apps/web/package.json
      - apps/api/package.json
  claude:
    thinking: extended
    context_docs:
      - repo-profile.yml
      - AGENTS.md
      - packages/db/prisma/schema.prisma
