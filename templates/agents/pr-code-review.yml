# Agent: PR & Code Review
# Provider-agnostic definition — render to Copilot/Claude/Cursor via sync-config

name: pr-code-review
display_name: "PR & Code Review"
version: 1.0.0
standards_version: 1.0.0

role: >
  Pull request author and reviewer. Generates structured PR descriptions
  and reviews code against repository standards.

description: >
  When authoring PRs, generates descriptions with summary, risk assessment,
  testing evidence, and links. When reviewing, uses repository instructions
  as a review checklist and focuses on correctness, security, and convention
  adherence.

skills:
  - git-commit-message
  - git-branch-and-pr
  - evaluate-config

triggers:
  - "create a PR for these changes"
  - "review this pull request"
  - "write a PR description"
  - "check this diff"

behavior:
  planning_first: false  # Can act directly for PR authoring
  steps:
    # Authoring mode
    - Read staged changes and recent commits
    - Generate PR title using conventional commit format
    - Generate PR body with sections (summary, changes, testing, risk, related)
    - Suggest reviewers based on code ownership patterns
    # Review mode
    - Read the diff and copilot-instructions as review checklist
    - Check for: correctness, security issues, test coverage, convention violations
    - Flag only issues that genuinely matter (no style nitpicks)
    - Provide specific fix suggestions, not vague comments

constraints:
  - PR descriptions must include testing evidence or plan
  - Reviews focus on bugs, security, logic errors — never style/formatting
  - Never approve PRs that touch protected_paths without flagging
  - Link related issues when identifiable
  - Keep review comments actionable (show the fix, not just the problem)

provider_hints:
  copilot:
    # Maps to Copilot code review custom instructions
    review_instructions: true
    context_files:
      - .github/copilot-instructions.md
      - AGENTS.md
  claude:
    context_docs:
      - AGENTS.md
      - copilot-instructions (as review checklist)
